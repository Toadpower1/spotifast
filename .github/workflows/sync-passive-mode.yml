name: Sync upstream and build Passive Mode

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: passive-mode-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Passive Mode branch
        uses: actions/checkout@v7
        with:
          ref: passive-mode
          fetch-depth: 0

      - name: Merge official Spotifast main
        id: sync
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (git remote get-url upstream 2>$null) {
            git remote set-url upstream https://github.com/crmne/spotifast.git
          } else {
            git remote add upstream https://github.com/crmne/spotifast.git
          }

          git fetch upstream main --tags

          $before = (git rev-parse HEAD).Trim()
          Write-Host "Passive Mode before sync: $before"
          Write-Host "Upstream main: $(git rev-parse upstream/main)"

          git merge upstream/main --no-edit

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "Automatic merge failed."
            Write-Host "Passive Mode was NOT pushed."
            Write-Host "Resolve the merge manually, then push passive-mode."
            git status
            exit 1
          }

          $after = (git rev-parse HEAD).Trim()
          $changed = $before -ne $after

          Write-Host "Passive Mode after sync: $after"
          Write-Host "Upstream changes found: $changed"

          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "sha=$after" >> $env:GITHUB_OUTPUT

      - name: Install Spotifast Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"'

          if (-not $match) {
            throw "Could not find the Rust channel in rust-toolchain.toml"
          }

          $channel = $match.Matches[0].Groups[1].Value
          Write-Host "Spotifast Rust toolchain: $channel"

          rustup toolchain install $channel --profile minimal --no-self-update
          rustup override set $channel

          rustc --version
          cargo --version

      - name: Build Passive Mode
        shell: pwsh
        run: cargo build --locked --release --no-default-features

      - name: Push updated Passive Mode branch
        if: steps.sync.outputs.changed == 'true'
        shell: pwsh
        run: git push origin HEAD:passive-mode

      - name: Package Windows build
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $versionLine.Matches[0].Groups[1].Value
          $sha = "${{ steps.sync.outputs.sha }}".Substring(0, 7)

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\spotifast.exe dist\spotifast-passive.exe

          @"
          Spotifast Passive Mode
          ======================

          Spotifast version: $version
          Passive Mode commit: $sha

          Automatically synced from:
          https://github.com/crmne/spotifast

          Build:
          cargo build --locked --release --no-default-features
          "@ | Set-Content -Encoding UTF8 dist\README.txt

          Compress-Archive `
            -Path dist\* `
            -DestinationPath "spotifast-passive-$version-windows-x64.zip" `
            -Force

          "SPOTIFAST_VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload current Windows build
        uses: actions/upload-artifact@v7
        with:
          name: spotifast-passive-${{ env.SPOTIFAST_VERSION }}-windows
          path: spotifast-passive-${{ env.SPOTIFAST_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
